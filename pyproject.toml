[project]
name = "constraintpuzzler"
version = "0.1.0"
description = "Solve number puzzles (Sudoku, Kakuro, Futoshiki, Sumbrero) by constraint propagation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["PySide6>=6.8"]

[dependency-groups]
dev = ["ruff", "pyright", "pre-commit"]

[tool.uv]
# An application run from the repository root, not an installable package.
package = false

[tool.ruff]
target-version = "py313"
extend-exclude = [
    # Generated by pyside6-uic / pyside6-rcc (see gui/ui/compile_ui.bat, gui/icons/compile_icons.bat)
    "gui/ui/mainWindowUi.py",
    "gui/icons/icons_rc.py",
]

[tool.ruff.lint]
# Start with syntax errors and undefined names only; tighten over time.
select = ["E9", "F63", "F7", "F82"]
