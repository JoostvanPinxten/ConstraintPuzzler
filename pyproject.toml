[project]
name = "constraintpuzzler"
version = "0.1.0"
description = "Solve number puzzles (Sudoku, Kakuro, Futoshiki, Sumbrero) by constraint propagation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["PySide6>=6.8"]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pre-commit",
    "pyinstaller>=6.22.3",
]

[tool.uv]
# An application run from the repository root, not an installable package.
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    # Generated by pyside6-uic / pyside6-rcc (see gui/ui/compile_ui.bat, gui/icons/compile_icons.bat)
    "gui/ui/mainWindowUi.py",
    "gui/icons/icons_rc.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["constraints", "parsers", "solver", "structure", "utility", "gui", "tests", "android", "*.py"]
exclude = [
    "gui/ui/mainWindowUi.py",
    "gui/icons/icons_rc.py",
    ".venv",
    "**/__pycache__",
]
# Accessing an attribute of a value that may be None (e.g. `cell.getValue().x` or
# `self.puzzle.grid` before a puzzle is loaded) must be narrowed first (an `is not None`
# check or an assert), so it fails CI.
reportOptionalMemberAccess = "error"

[tool.ruff.lint.flake8-bugbear]
# Qt's idiomatic `parent=QModelIndex()` default arguments are immutable value types.
extend-immutable-calls = ["PySide6.QtCore.QModelIndex"]
