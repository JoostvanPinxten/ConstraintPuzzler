name: Release

# Push a tag vX.Y.Z (matching "version" in package.json) to build the app for every platform
# (app-builds.yml) and publish it: the desktop installers (Windows, macOS, Linux) and the
# Android APK as a GitHub Release, and the web version on GitHub Pages (the repository's Pages
# source must be set to "GitHub Actions").
# Run it manually (workflow_dispatch) for a dry run: it builds and uploads workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    uses: ./.github/workflows/app-builds.yml

  pages:
    # the web version of the app, at https://<owner>.github.io/<repository>/
    if: github.ref_type == 'tag'
    needs: [app]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy

  release:
    if: github.ref_type == 'tag'
    needs: [app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true
      - name: Create or update GitHub Release
        run: |
          # If the release was already created (e.g. by hand in the GitHub UI), attach the
          # files to it instead of failing.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "ConstraintPuzzler ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
