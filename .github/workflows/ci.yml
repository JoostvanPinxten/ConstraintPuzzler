name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: ESLint and Prettier
        run: npm run lint
      - name: No trailing whitespace or missing final newline
        if: runner.os == 'Linux'
        run: |
          bad=$(git ls-files -z -- ':!*.png' ':!*.ico' ':!*.icns' ':!package-lock.json' \
            | xargs -0 grep -lIE '[[:space:]]+$' || true)
          if [[ -n "$bad" ]]; then echo "::error::trailing whitespace in:"; echo "$bad"; exit 1; fi
      - name: Unit tests (engine, golden fixtures, app) with coverage thresholds
        run: npm test
